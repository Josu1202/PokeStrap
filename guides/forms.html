<main>

<header>
    <h1>Forms</h1>
    <p>Los formularios permiten recopilar datos del usuario.</p>
</header>

<section>
    <h2>Formulario básico</h2>

    <form>
        <fieldset>
            <legend>Información</legend>

            <label>Nombre</label>
            <input type="text">

            <label>Email</label>
            <input type="email">

            <label>Contraseña</label>
            <input type="password">
        </fieldset>

        <button type="submit">Enviar</button>
    </form>
</section>

<section>
    <h2>Tipos de inputs</h2>

    <ul>
        <li><input type="text"> Texto</li>
        <li><input type="email"> Email</li>
        <li><input type="checkbox"> Checkbox</li>
        <li><input type="radio"> Radio</li>
    </ul>
</section>

<section>
    <h2>Código</h2>
    <pre><code>
&lt;form&gt;
  &lt;input type="text"&gt;
  &lt;button&gt;Enviar&lt;/button&gt;
&lt;/form&gt;
    </code></pre>
</section>

</main>
