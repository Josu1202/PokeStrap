<main>

<header>
    <h1>Buttons</h1>
    <p>Los botones permiten a los usuarios ejecutar acciones o navegar dentro de la aplicación.</p>
</header>

<section>
    <h2>Ejemplo básico</h2>

    <button>Botón</button>
    <button type="submit">Enviar</button>
    <button type="reset">Resetear</button>
</section>

<section>
    <h2>Tipos de botón</h2>

    <article>
        <h3>Botón estándar</h3>
        <button>Click</button>
    </article>

    <article>
        <h3>Botón como enlace</h3>
        <a href="#">Ir a página</a>
    </article>

    <article>
        <h3>Botón deshabilitado</h3>
        <button disabled>No disponible</button>
    </article>
</section>

<section>
    <h2>Código</h2>
    <pre><code>
&lt;button&gt;Botón&lt;/button&gt;
&lt;button type="submit"&gt;Enviar&lt;/button&gt;
&lt;a href="#"&gt;Link&lt;/a&gt;
    </code></pre>
</section>

</main>
